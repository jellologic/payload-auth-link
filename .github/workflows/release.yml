# Release via changesets: pushes to main open a "Version Packages" PR;
# merging it publishes to npm through `bun run release`
# (scripts/publish.mjs) with provenance attestations via trusted
# publishing (OIDC) — no long-lived token anywhere.
name: release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 ships
      # npm 10, which cannot exchange the OIDC token and sends an
      # unauthenticated PUT (npm answers 404).
      - run: npm install -g npm@^11.5.1 && npm --version
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: changesets/action@v1
        with:
          version: bun run version-packages
          publish: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
