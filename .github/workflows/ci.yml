name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; no job here needs more. (release.yml publishes
# only after this workflow succeeds on main.)
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # Workflows + dependabot.yml parse strictly (duplicate keys fail),
      # declare top-level permissions, and pin every action by SHA.
      # (Also part of `bun run check`; first here so it fails fast.)
      - run: bun run ci:lint
      # The migration kit's doctor runs its fixture-backed suites here
      # (the fixture app owns its dependency tree).
      - run: bun install --cwd fixtures/payload-auth-app
      - run: bun run check

  # The suites must hold on every Node version `engines` allows — Bun's
  # runtime masks Node-only loader differences (the CSS-import case),
  # so the same vitest suite runs under each Node explicitly.
  test-node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # setup-node >= 5 auto-caches from `packageManager` (bun: unsupported).
          package-manager-cache: false
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      # The suites resolve workspace packages through their dist
      # exports — build once under Bun, run the tests under the matrix
      # Node.
      - run: bun run build
      - run: node node_modules/vitest/vitest.mjs run

  # The examples are the documented reference integrations: both must
  # type-check against the freshly built packages (they import the
  # workspace packages through their dist exports, hence the build
  # first), and the Next example must survive a production build.
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx tsc --noEmit -p examples/basic
      - run: bunx tsc --noEmit -p examples/tanstack-start
      # A dev run writes `payload-types.ts` (ignored), which narrows the
      # Local API's slugs to the generated union: the examples must
      # type-check (and build) with it too, not only on a clean checkout.
      - run: bunx payload generate:types
        working-directory: examples/basic
      - run: bunx payload generate:types
        working-directory: examples/tanstack-start
      - run: bunx tsc --noEmit -p examples/basic
      - run: bunx tsc --noEmit -p examples/tanstack-start
      - run: bun run --cwd examples/basic build

  # Every user-facing PR carries a changeset (see CONTRIBUTING.md);
  # internal-only PRs add an empty one (`bunx changeset --empty`). The
  # Version Packages PR is exempt: it consumes the changesets by design.
  changeset:
    # Dependency bumps are internal-only (the lockfile diff is their
    # record; the compat matrix is their gate), like Version PRs.
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx changeset status --since=origin/${{ github.base_ref }}

  # Generated docs never drift: llms artifacts regenerate as a no-op,
  # media references resolve, and typedoc builds docs/api warning-free.
  docs-fresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run docs:check
      - run: git diff --exit-code -- llms.txt llms-full.txt

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium firefox webkit
      - run: bun run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  e2e-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: payload
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      PGUSER: postgres
      PGPASSWORD: payload
      PGHOST: localhost
      PGPORT: 5432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e:postgres
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces-postgres
          path: test-results/
          retention-days: 7

  e2e-mongo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e:mongo
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces-mongo
          path: test-results/
          retention-days: 7

  # `policies.requireMfaForRoles` (issue #84): a Better-Auth-only
  # variant of examples/basic (E2E_MFA_POLICY=1) on its own port and
  # SQLite file — the policy cannot be wired beside Auth.js (D4).
  e2e-mfa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e:mfa -- --project=chromium
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces-mfa
          path: test-results/
          retention-days: 7

  # External-IdP variant (issue #84): social OAuth, One Tap, phone, SSO
  # domains, multi-session, roleValues, reqUser against a local mock
  # OIDC provider (e2e/mock-idp.ts). Own port and SQLite file per app.
  e2e-idp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium webkit
      - run: bun run e2e:idp -- --project=chromium --project=webkit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces-idp
          path: test-results/
          retention-days: 7

  e2e-tanstack-idp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium webkit
      - run: bun run e2e:tanstack-idp -- --project=chromium --project=webkit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces-tanstack-idp
          path: test-results/
          retention-days: 7

  e2e-tanstack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium firefox webkit
      - run: bun run e2e:tanstack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces-tanstack
          path: test-results/
          retention-days: 7

  e2e-tanstack-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: payload
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      PGUSER: postgres
      PGPASSWORD: payload
      PGHOST: localhost
      PGPORT: 5432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e:tanstack-postgres
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces-tanstack-postgres
          path: test-results/
          retention-days: 7

  e2e-tanstack-mongo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e:tanstack-mongo
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces-tanstack-mongo
          path: test-results/
          retention-days: 7

  # Off-ramp (issue #58): uninstalling the plugin must leave users and
  # content intact. The uninstall test boots the example shape WITH the
  # plugin + data, reboots WITHOUT it on the same database, and asserts
  # users/content survive.
  uninstall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # The test boots real Payload configs through the built workspace
      # packages (dist).
      - run: bun run build
      - run: bunx vitest run packages/plugin/src/__tests__/uninstall.test.ts

  # Migration kit (issues #49–#59): the payload-auth fixture is the
  # contract every migration feature tests against. Postgres is the
  # minimum matrix cell — the fixture IS a Postgres dump.
  migration-fixture:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: payload
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432
    env:
      FIXTURE_DATABASE_URL: postgres://postgres:payload@localhost:5433/pal_fixture
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # The kit's suites boot real Payload configs through the built
      # workspace packages (dist), and the fixture app installs its own
      # dependency tree.
      - run: bun run build
      - run: bun install --cwd fixtures/payload-auth-app
      - run: bun run test:fixture
      # Organization governance on Postgres: real transactions, foreign
      # keys and the last-owner race, which SQLite in memory skips.
      - run: psql -h localhost -p 5433 -U postgres -c "CREATE DATABASE pal_orgs"
        env:
          PGPASSWORD: payload
      - run: bunx vitest run packages/plugin/src/__tests__/integration-organizations-governance.test.ts
        env:
          ORG_PG_URL: postgres://postgres:payload@localhost:5433/pal_orgs

  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run release:check
