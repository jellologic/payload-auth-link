# Upstream bumps arrive as reviewed PRs that run the full gates
# (PLAN-UPGRADE-RESILIENCE Phase 1 / B5): never a silent float inside
# a wide range. The compat workflow owns {floor, latest}; these PRs
# keep the installed versions (the "latest" cells) moving.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Toolchain majors are curated migrations (typescript-eslint does
    # not support TS 7 yet; vitest 5, mongodb 7, size-limit 14 and
    # @types/node 26 each need their own pass), not routine bumps.
    ignore:
      - dependency-name: effect
        versions: ['>=4.0.0-0']
      - dependency-name: typescript
        versions: ['>=7.0.0-0']
      - dependency-name: vitest
        versions: ['>=5.0.0-0']
      - dependency-name: '@vitest/*'
        versions: ['>=5.0.0-0']
      - dependency-name: mongodb
        versions: ['>=7.0.0-0']
      - dependency-name: '@types/node'
        versions: ['>=23.0.0-0']
      - dependency-name: size-limit
        versions: ['>=12.0.0-0']
      - dependency-name: '@size-limit/*'
        versions: ['>=12.0.0-0']
    # Payload v4 prereleases (internal builds, canaries, betas) move
    # only via the manual exact pin + compat validation (the version
    # assertion refuses them; see docs/compatibility.md) — never as a
    # routine float.
    ignore:
      - dependency-name: payload
        versions: ['>=4.0.0-0']
      - dependency-name: '@payloadcms/*'
        versions: ['>=4.0.0-0']
    groups:
      payload:
        patterns:
          - payload
          - '@payloadcms/*'
      better-auth:
        patterns:
          - better-auth
          - '@better-auth/*'
      tanstack:
        patterns:
          - '@tanstack/*'
      react:
        patterns:
          - react
          - react-dom
      dev-tools:
        dependency-type: development
        # Effect 4 renames the APIs the interop test pins
        # (Effect.either, standardSchemaV1); migrating the test to
        # Effect 4 is deliberate work, not a routine bump.
        exclude-patterns:
          - effect
